<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Foresight Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f1f3f5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .fw-nav {
            background: #f1f3f5;
            border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 40px;
        }
        .fw-nav-btns { display: flex; gap: 10px; }
        .fw-btn-outline {
            border: 1px solid #cbd5e1; background: white;
            color: #0f172a; padding: 9px 22px; border-radius: 6px;
            font-size: 15px; cursor: pointer; text-decoration: none;
            display: inline-block;
        }
        .fw-btn-outline:hover { background: #e9ebed; color: #0f172a; }
        .fw-btn-solid {
            background: #2563eb; border: none;
            color: white; padding: 9px 22px; border-radius: 6px;
            font-size: 15px; cursor: pointer; text-decoration: none;
            display: inline-block;
        }
        .fw-btn-solid:hover { background: #1d4ed8; color: white; }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
        }
        .login-input {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            padding: 11px 14px;
            font-size: 15px;
            width: 100%;
        }
        .login-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .login-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
        }
        .login-btn:hover { background: #1d4ed8; color: white; }
        .divider {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin: 18px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            border-top: 1px solid #e2e8f0;
        }
        .fw-footer {
            background: #0f172a; color: #475569;
            text-align: center; padding: 20px;
            font-size: 14px;
        }
        .fw-footer span { color: #2563eb; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="fw-nav">
    <a href="/">
        <img src="{{ url_for('static', filename='logoN.png') }}" alt="Foresight Wallet" style="height:50px;">
    </a>
    <div class="fw-nav-btns">
        <a href="/login" class="fw-btn-outline">Sign In</a>
        <a href="/register" class="fw-btn-solid">Sign Up</a>
    </div>
</nav>

<!-- LOGIN CARD -->
<div class="login-wrapper">
    <div class="login-card text-center">

        <div class="mb-4">
            <div style="font-size: 28px;"><i class="bi bi-lock-fill" style="color:#4e73df;"></i></div>
            <h4 class="mt-3" style="color:#0f172a; font-weight:600;">Welcome Back</h4>
        </div>

        <form method="POST" action="/login">
            <div class="mb-3">
                <input type="email" class="login-input" name="email" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <input type="password" class="login-input" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn login-btn w-100">Sign In</button>
        </form>

        <div style="display:flex; align-items:center; margin:18px 0; color:#94a3b8; font-size:13px;">
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
            <span style="padding: 0 12px;">OR</span>
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
        </div>

        <a href="/google-login" class="btn btn-outline-secondary w-100 mb-3" style="border-color:#e2e8f0; color:#0f172a;">
            <img src="https://developers.google.com/identity/images/g-logo.png" width="18" class="me-2">
            Sign in with Google
        </a>

        <div class="mt-3">
            <small style="color:#64748b;">
                Don't have an account?
                <a href="/register" class="fw-semibold text-decoration-none" style="color:#2563eb;">Sign Up</a>
            </small>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer class="fw-footer">
    <span>Foresight Wallet 2026</span> • Developed by Tahmid Islam for Final Year Project
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
