<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - Foresight Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
</head>
<body class="auth-body">

<!-- NAVBAR -->
<nav class="fw-nav">
    <a href="/">
        <img src="{{ url_for('static', filename='LogoN.png') }}" alt="Foresight Wallet" style="height:50px;">
    </a>
    <div class="fw-nav-btns">
        <a href="/login" class="fw-btn-outline">Sign In</a>
        <a href="/register" class="fw-btn-solid">Sign Up</a>
    </div>
</nav>

<!-- REGISTER CARD -->
<div class="login-wrapper">
    <div class="login-card text-center">

        <div class="mb-4">
            <div style="font-size: 28px;"><i class="bi bi-person-plus-fill" style="color:#4e73df;"></i></div>
            <h4 class="mt-3" style="color:#0f172a; font-weight:600;">Create Account</h4>
        </div>

        <form method="POST" action="/register">
            <div class="row">
                <div class="col-6 mb-3">
                    <input type="text" class="login-input" name="first_name" placeholder="First Name" required>
                </div>
                <div class="col-6 mb-3">
                    <input type="text" class="login-input" name="last_name" placeholder="Last Name" required>
                </div>
            </div>
            <div class="mb-3">
                <input type="email" class="login-input" name="email" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <input type="password" class="login-input" name="password" placeholder="Password" required>
            </div>
            <div class="mb-3">
                <input type="password" class="login-input" name="confirm_password" placeholder="Repeat Password" required>
            </div>
            <button type="submit" class="btn login-btn w-100">Sign Up</button>
        </form>

        <div style="display:flex; align-items:center; margin:18px 0; color:#94a3b8; font-size:13px;">
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
            <span style="padding: 0 12px;">OR</span>
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
        </div>

        <a href="/google-login" class="btn btn-outline-secondary w-100 mb-3" style="border-color:#e2e8f0; color:#0f172a;">
            <img src="https://developers.google.com/identity/images/g-logo.png" width="18" class="me-2">
            Sign up with Google
        </a>

        <div class="mt-3">
            <small style="color:#64748b;">
                Already have an account?
                <a href="/login" class="fw-semibold text-decoration-none" style="color:#2563eb;">Sign In</a>
            </small>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer class="fw-footer">
    <span>Foresight Wallet 2026</span> • Developed by Tahmid Islam for Final Year Project
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
